<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Power Zone Fitness Club</title>
  <link rel="icon" type="image/png" href="./images/power-zone-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <nav class="navbar">
      <div class="logo">
        <a href="index.html"><img src="./images/power-zone-logo.png" alt="Power Zone Fitness Club logo"></a>
      </div>
      <a href="index.html" class="btn btn-outline">Back to home</a>
    </nav>
  </header>

  <main>
    <section id="join">
      <div class="contact-wrapper">
        <div class="contact-info">
          <p class="eyebrow">Membership</p>
          <h1 class="section-title">Join the club</h1>
          <p>Fill in the form and we will contact you about your membership.</p>
          <p><a href="index.html#membership" class="btn btn-outline">Back to plans</a></p>
        </div>

        <form id="join-form">
          <div class="field">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name">
            <p class="error" id="name-error"></p>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
            <p class="error" id="email-error"></p>
          </div>

          <div class="field">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone">
            <p class="error" id="phone-error"></p>
          </div>

          <div class="field">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="10" max="100">
            <p class="error" id="age-error"></p>
          </div>

          <div class="field">
            <label for="plan">Membership plan</label>
            <select id="plan" name="plan">
              <option value="">Choose a plan</option>
              <option value="Standard">Standard</option>
              <option value="Silver">Silver</option>
              <option value="Gold">Gold</option>
              <option value="Premium">Premium</option>
            </select>
            <p class="error" id="plan-error"></p>
          </div>

          <div class="field">
            <label for="experience">Experience level (optional)</label>
            <select id="experience" name="experience">
              <option value="">Choose one</option>
              <option value="Beginner">Beginner</option>
              <option value="Some experience">Some experience</option>
              <option value="Regular training">Regular training</option>
            </select>
          </div>

          <div class="field">
            <label for="goals">Your goals (optional)</label>
            <textarea id="goals" name="goals" rows="4"></textarea>
          </div>

          <button type="submit" class="btn">Send request</button>
          <p class="success" id="form-success"></p>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <a href="index.html" class="footer-brand"><img src="./images/power-zone-logo.png"
        alt="Power Zone Fitness Club logo"></a>
    <p>&copy; 2026 Power Zone Fitness Club. All rights reserved.</p>
    <p>Designed and developed by <span>Lotfy Ahmed</span></p>
  </footer>
  <script src="join.js"></script>
</body>

</html>
